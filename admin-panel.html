<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MH SOCIAL | Admin Panel</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0f19;color:#e2e8f0;font:15px 'Segoe UI',sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;color:#fff}.panel,.metric{background:linear-gradient(145deg,#1d3045,#17283c);border:1px solid #334e68;border-radius:14px;padding:18px;box-shadow:0 10px 24px #0005}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric strong{display:block;font-size:26px;color:#2dd4bf}.metric span{color:#94a3b8}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:18px}h2{margin-top:0;color:#f8fafc}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 7px;border-bottom:1px solid #334155;vertical-align:top}select,input,textarea,button{font:inherit;border-radius:7px;padding:9px;border:1px solid #475569}input,textarea,select{width:100%;background:#0f172a;color:#fff}textarea{min-height:80px}.btn{background:#2dd4bf;color:#07151c;border:0;font-weight:700;cursor:pointer}.danger{background:#fb7185}.muted{color:#94a3b8}.login{max-width:380px;margin:14vh auto}.login form{display:grid;gap:12px}.hidden{display:none}.msg{color:#2dd4bf;margin:10px 0}@media(max-width:800px){.metrics{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.wrap{padding:14px}table{font-size:13px}}
</style>
</head>
<body>
<main class="wrap">
<section id="login" class="panel login"><h1>Admin Login</h1><p class="muted">Secure MH SOCIAL management</p><form id="login-form"><input id="username" value="admin" autocomplete="username" placeholder="Username"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button class="btn">Sign in</button></form><p id="login-error" class="muted"></p></section>
<section id="dashboard" class="hidden"><header class="top"><h1>Admin Panel</h1><button id="logout" class="btn danger">Log out</button></header><div id="metrics" class="metrics"></div><div id="message" class="msg"></div><div class="layout"><section class="panel"><h2>Orders</h2><div style="overflow:auto"><table><thead><tr><th>ID</th><th>Service</th><th>Customer</th><th>Contact</th><th>Status</th></tr></thead><tbody id="orders"></tbody></table></div></section><section class="panel"><h2>Add Service</h2><form id="service-form"><input id="service-name" placeholder="Service name" required><textarea id="service-description" placeholder="Description"></textarea><input id="service-price" type="number" min="0" placeholder="BDT price"><input id="service-usd" placeholder="USD price"><input id="service-delivery" placeholder="Delivery time"><button class="btn">Add service</button></form><h2 style="margin-top:26px">Services</h2><div id="services"></div></section></div><section class="panel" style="margin-top:18px"><h2>Reviews</h2><div id="reviews"></div></section></section>
</main>
<script>
const $=id=>document.getElementById(id);const API_BASE=location.protocol==='file:'?'http://127.0.0.1:8000':'';const api=async(url,options={})=>{const res=await fetch(`${API_BASE}${url}`,{credentials:'include',headers:{'Content-Type':'application/json'},...options});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'Request failed');return data};
function message(text){$('message').textContent=text;setTimeout(()=>$('message').textContent='',3000)}
function render(data){const labels=[['total_orders','Total Orders'],['pending_orders','Pending Orders'],['processing_orders','Processing Orders'],['completed_orders','Completed Orders'],['cancelled_orders','Cancelled Orders'],['total_reviews','Total Reviews'],['new_reviews','New Reviews'],['total_services','Total Services']];$('metrics').innerHTML=labels.map(([k,label])=>`<div class="metric"><strong>${data.counts[k]}</strong><span>${label}</span></div>`).join('');$('orders').innerHTML=data.orders.map(o=>`<tr><td>#${o.id}</td><td>${esc(o.service_name||'Removed service')}</td><td>${esc(o.customer_name)}</td><td>${esc(o.customer_contact)}</td><td><select onchange="updateOrder(${o.id},this.value)">${['pending','processing','completed','cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="5" class="muted">No orders yet.</td></tr>';$('services').innerHTML=data.services.map(s=>`<p><b>${esc(s.name)}</b><br><span class="muted">${esc(s.price_bdt)} BDT · ${esc(s.delivery)}</span></p>`).join('')||'<p class="muted">No services.</p>';$('reviews').innerHTML=data.reviews.map(r=>`<article style="border-bottom:1px solid #334155;padding:12px 0"><b>${esc(r.customer_name)}</b> · ${'★'.repeat(r.rating)}<p>${esc(r.message)}</p><select onchange="updateReview(${r.id},this.value)">${['new','approved','rejected'].map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></article>`).join('')||'<p class="muted">No reviews yet.</p>'}
function esc(value){return String(value??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function load(){try{const data=await api('/api/admin/dashboard');$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');render(data)}catch(e){$('login').classList.remove('hidden');$('login-error').textContent=e.message==='Failed to fetch'?'Start server.py, then open http://127.0.0.1:8000/admin-panel.html.':e.message}}
async function updateOrder(id,status){try{await api(`/api/admin/orders/${id}`,{method:'PATCH',body:JSON.stringify({status})});message('Order updated');load()}catch(e){message(e.message)}}
async function updateReview(id,status){try{await api(`/api/admin/reviews/${id}`,{method:'PATCH',body:JSON.stringify({status})});message('Review updated');load()}catch(e){message(e.message)}}
$('login-form').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});load()}catch(error){$('login-error').textContent=error.message}};
$('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};$('service-form').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/services',{method:'POST',body:JSON.stringify({name:$('service-name').value,description:$('service-description').value,price_bdt:$('service-price').value,price_usd:$('service-usd').value,delivery:$('service-delivery').value})});e.target.reset();message('Service added');load()}catch(error){message(error.message)}};load();
</script>
</body></html>
